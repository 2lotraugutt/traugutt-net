name: Build and Push Docker Image

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: git.traugutt.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          # Build the image with the commit hash tag
          docker build -t git.traugutt.net/traugutt/traugutt-net/docker:${BRANCH_NAME}-latest .
      - name: Push Docker Image
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SHORT_HASH: ${{ github.sha }}
        run: |
          docker push git.traugutt.net/traugutt/traugutt-net/docker:${BRANCH_NAME}-latest

      - name: Log out from registry
        if: always()
        run: docker logout git.traugutt.net
